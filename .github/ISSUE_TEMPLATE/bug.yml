name: Bug report
description: Сообщение об ошибке или регрессии
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Что произошло
      description: Опишите фактическое поведение.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: URL или commit, браузер, устройство и viewport.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Скриншоты и логи
